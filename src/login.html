<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - To-Do App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen">

  <!-- Login Container -->
  <div class="bg-white rounded-lg shadow-xl p-10 w-full sm:w-96">
    <!-- Logo Section -->
    <div class="flex justify-center mb-8">
      <img src="/src/ChatGPT Image Apr 28, 2025, 04_10_05 PM.png" alt="Logo" class="w-12 h-12">
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-semibold text-center text-[#4CAF50] mb-6">Welcome Back!</h2>
    <p class="text-center text-gray-600 mb-8">Sign in to your account</p>

    <!-- Login Form -->
    <form action="#" method="POST">
      <!-- Email Input -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-semibold text-gray-700">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4CAF50] focus:border-[#4CAF50]" required>
      </div>

      <!-- Password Input -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4CAF50] focus:border-[#4CAF50]" required>
      </div>

      <!-- Forgot Password Link -->
      <div class="text-right mb-6">
        <a href="#" class="text-sm text-[#388E3C] hover:text-[#4CAF50]">Forgot your password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="w-full bg-[#4CAF50] text-white py-2 rounded-lg font-semibold hover:bg-[#388E3C] focus:outline-none">Sign In</button>
    </form>

    <!-- Sign Up Link -->
    <div class="mt-6 text-center">
      <p class="text-sm text-gray-600">Don't have an account? <a href="#signup" class="text-[#388E3C] hover:text-[#4CAF50] font-semibold">Sign Up</a></p>
    </div>
  </div>

</body>
</html>
